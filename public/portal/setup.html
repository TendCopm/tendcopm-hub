<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TendCo™ Hub · Create your account</title>
<meta name="theme-color" content="#1F5BD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css?v=20261027mobileAgenda">
<link rel="stylesheet" href="assets/setup.css?v=20261027mobileAgenda">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body class="setup-body">
<div class="demo-banner">The Hub by TendCo™ · Account setup <span>· demo preview</span></div>
<a class="portal-back" href="/turn-board/">← Back to The Hub</a>

<div class="setup-shell">
  <div class="setup-card" role="main">
    <div class="setup-brand">
      <img class="wm" src="assets/TendCo-Wordmark-TM.svg" alt="TendCo™" width="160" height="28">
      <div class="setup-steps" id="setup-steps" aria-label="Setup progress">
        <span data-step="1" class="on">1</span><i></i>
        <span data-step="2">2</span><i></i>
        <span data-step="3">3</span>
      </div>
    </div>

    <h1 id="setup-title">Create your profile</h1>
    <p class="lede" id="setup-lede">First page when a maintenance supervisor or property manager receives The Hub.</p>
    <div id="setup-err" class="setup-err" role="alert" hidden></div>

    <div id="setup-body"><!-- filled by JS --></div>

    <div class="setup-foot">
      <button class="btn ghost sm" type="button" id="setup-back" hidden>Back</button>
      <div class="sp"></div>
      <button class="btn sec sm" type="button" id="setup-skip" title="Demo only">Skip to Hub</button>
      <button class="btn pri sm" type="button" id="setup-next">Continue</button>
    </div>
  </div>
</div>

<script src="assets/setup.js?v=20261027mobileAgenda"></script>
</body>
</html>
